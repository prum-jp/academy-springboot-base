<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Profile edit</title>
        <link th:href="@{/css/style.css}" rel="stylesheet">
    </head>
    <body>

        <header class="header">
            <div class="logo">My Portfolio</div>
            
            <a th:href="@{/login}" class="header-btn">ログアウト</a>
        </header>

        <main class="main-container Profile-edit">

            <h1 class="page-title">自己紹介を編集する</h1>

            <form th:action="@{/Profile-edit}" method="post" enctype="multipart/form-data">

                <div class="form-group">
                    <label class="form-label">自己紹介文</label>
                    <textarea name="introduction" rows="5" class="form-textarea"></textarea>
                    <p class="form-hint">50文字以上、200文字以下で入力してください。</p>
                </div>

                <div class="form-group">
                    <label class="form-label">アバター画像</label>
                    <input type="file" name="avatarFile" class="form-file" />
                </div>

                <button type="submit" class="submit-btn">自己紹介文を確定する</button>
            </form>
        </main>

        <footer class="footer">
            <div class="footer-logo">portfolio site</div>
        </footer>

    </body>

</html>

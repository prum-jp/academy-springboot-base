<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign in</title>
        <link th:href="@{/css/style.css}" rel="stylesheet">
    </head>
    <body>

        <header class="header">
            <div class="logo">My Portfolio</div>
            <a th:href="@{/login}" class="header-btn">ログイン</a>
        </header>

        <main class="main-container">
            <h1 class="page-title">新規登録</h1>

            <form th:action="@{/register}" th:object="${springbootForm}" method="post" class="signup-form">

            <div class="form-group">
                <label class="form-label">氏名</label>
                <input type="text" th:field="*{name}" />

                <div class="error-msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-group">
                <label class="form-label">メールアドレス</label>
                <input type="email" th:field="*{email}" />

                <div class="error-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label class="form-label">パスワード</label>
                <input type="password" th:field="*{password}" />

                <div class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="submit-btn">登録する</button>
            </form>
        </main>

        <footer class="footer">
            <div class="footer-logo">portfolio site</div>
        </footer>
    </body>
</html>
